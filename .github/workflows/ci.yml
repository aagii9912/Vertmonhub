name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `continue-on-error: true` байсан тул lint хэзээ ч build-ыг блоклодоггүй,
      # улмаас аюулгүй байдлын eslint дүрмүүд (жишээ нь getSession хориглох)
      # утгагүй болсон байв. Одоо lint нь бодит хаалга.
      - name: Lint
        run: npm run lint

      # Аудит ба эрхийн хамрах хүрээний регрессийн хаалга — шинэ mutating
      # route хамгаалалт эсвэл аудитгүйгээр нэмэгдвэл CI унана.
      - name: Audit coverage gate
        run: node scripts/check-audit-coverage.mjs

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders so the build doesn't fail on missing secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          GEMINI_API_KEY: placeholder
          NEXT_PUBLIC_APP_URL: https://example.com
