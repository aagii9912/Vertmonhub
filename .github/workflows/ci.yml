name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # 2026-09: continue-on-error хасав — lint алдаа PR-ийг унагана (анхааруулга унагахгүй)
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Atomic payment migration checks
        run: npm run test:payments

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Isolated authenticated browser workflows
        run: npm run test:workflow

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-workflow-failures
          path: |
            test-results/workflow/
            playwright-report/
          retention-days: 7

      - name: Dependency audit (critical)
        # Critical production dependency advisories block release.
        run: npm audit --omit=dev --audit-level=critical

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders so the build doesn't fail on missing secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          GEMINI_API_KEY: placeholder
          NEXT_PUBLIC_APP_URL: https://example.com
