name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # 2026-09: continue-on-error хасав — lint алдаа PR-ийг унагана (анхааруулга унагахгүй)
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Dependency audit (critical)
        # `xlsx`-д засваргүй high байгаа тул одоогоор зөвхөн critical-д унана
        run: npm audit --omit=dev --audit-level=critical

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders so the build doesn't fail on missing secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          GEMINI_API_KEY: placeholder
          NEXT_PUBLIC_APP_URL: https://example.com
